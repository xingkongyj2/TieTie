# CNB_TOKEN、CNB_TOKEN_USER_NAME 和 CNB_DOCKER_REGISTRY 由 CNB 在流水线运行时自动注入。
# 不要在仓库中填写个人访问令牌；这里的令牌仅供本次构建使用。
main:
  push:
    - services:
        - docker
      stages:
        - name: docker login
          script: printf '%s' "$CNB_TOKEN" | docker login "$CNB_DOCKER_REGISTRY" -u "${CNB_TOKEN_USER_NAME:-cnb}" --password-stdin
        - name: build and push TieTie backend
          script: |
            docker build -f ./deploy/dockerfile --build-arg VCS_REF=${CNB_COMMIT} -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/tietie:1 -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/tietie:${CNB_COMMIT} .
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/tietie:1
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/tietie:${CNB_COMMIT}
